version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: autodraft
      POSTGRES_PASSWORD: autodraft_pass
      POSTGRES_DB: autodraft
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend/prisma:/app/prisma:ro

  ai-worker:
    build: ./ai-worker
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
      - backend

  render-engine:
    build: ./render-engine
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
      - backend
      - minio

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
